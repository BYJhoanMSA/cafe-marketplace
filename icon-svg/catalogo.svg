      <ellipse cx="0" cy="0" rx="3.2" ry="4.7"/>
      <path d="M0 -3.4 C-1.1 -1.5 1.2 -.3 0 3.4"/>
    </g>

    <!-- Grano derecho -->
    <g transform="translate(17.1 13.1) rotate(18)">
      <ellipse cx="0" cy="0" rx="2.4" ry="3.5"/>
      <path d="M0 -2.5 C-.8 -1.1 .9 -.2 0 2.5"/>
    </g>

  </g>

</svg>