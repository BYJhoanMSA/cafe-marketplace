<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     fill="none">

  <g stroke="currentColor"
     stroke-width="5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Centro -->
    <circle cx="64" cy="64" r="8"/>

    <!-- Pétalo superior -->
    <ellipse cx="64" cy="42" rx="10" ry="14"/>

    <!-- Superior derecho -->
    <ellipse cx="84" cy="56"
             rx="10"
             ry="14"
             transform="rotate(35 84 56)"/>

    <!-- Inferior derecho -->
    <ellipse cx="76" cy="82"
             rx="10"
             ry="14"
             transform="rotate(-35 76 82)"/>

    <!-- Inferior izquierdo -->
    <ellipse cx="52" cy="82"
             rx="10"
             ry="14"
             transform="rotate(35 52 82)"/>

    <!-- Superior izquierdo -->
    <ellipse cx="44" cy="56"
             rx="10"
             ry="14"
             transform="rotate(-35 44 56)"/>

  </g>

</svg>